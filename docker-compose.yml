services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Inside the compose network, the app reaches Redis by service name,
      # not localhost - overrides the default in app/infra/redis_client.py.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
